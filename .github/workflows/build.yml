name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.0

      - name: Build
        shell: bash
        run: gradle build --console=plain 2>&1 | tee build.log

      - name: Show error summary
        if: failure()
        run: |
          grep -n -B2 -A15 "What went wrong" build.log || true
          grep -n "error:" build.log | head -40 || true

      - uses: actions/upload-artifact@v4
        with:
          name: autobuild-addon
          path: build/libs/*.jar
